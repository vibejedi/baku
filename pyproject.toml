[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baku"
version = "0.1.0"
description = "Baku: a local AI assistant for Windows that tidies files, tracks money and reminders, and checks PC health."
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
baku = "baku.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
